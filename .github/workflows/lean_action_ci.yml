name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The credentials subpackage's HTTP client builds its shim with `pkg-config libcurl`, which
      # needs the development package and not just the runtime library the runner already has.
      - name: Install libcurl
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev pkg-config
      - uses: leanprover/lean-action@v1
